<svg width="1280" height="320" viewBox="0 0 1280 320" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Camilo González Toro — Full Stack Developer and Audiovisual Producer & Editor">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#818CF8"/>
      <stop offset="1" stop-color="#E879F9"/>
    </linearGradient>

    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#3F3F46"/>
    </pattern>

    <radialGradient id="fade" cx="34%" cy="32%" r="78%">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#000000"/>
    </radialGradient>
    <mask id="gridmask">
      <rect width="1280" height="320" fill="url(#fade)"/>
    </mask>

    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="95"/>
    </filter>

    <clipPath id="round">
      <rect width="1280" height="320" rx="24"/>
    </clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1280" height="320" fill="#121212"/>

    <ellipse cx="470" cy="120" rx="300" ry="210" fill="#6366F1" fill-opacity="0.28" filter="url(#glow)"/>
    <ellipse cx="960" cy="300" rx="240" ry="170" fill="#E879F9" fill-opacity="0.16" filter="url(#glow)"/>

    <rect width="1280" height="320" fill="url(#dots)" fill-opacity="0.55" mask="url(#gridmask)"/>

    <rect x="72" y="82" width="34" height="3" rx="1.5" fill="#818CF8"/>
    <text x="120" y="94" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" letter-spacing="3" fill="#A1A1AA">CAMILO GONZÁLEZ TORO &#8212; CALI, COLOMBIA</text>

    <text x="70" y="182" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="60" font-weight="700" fill="#FFFFFF">Engineering meets <tspan fill="url(#accent)">motion.</tspan></text>

    <text x="72" y="232" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="500" fill="#A1A1AA">Full Stack Developer &#183; Audiovisual Producer &amp; Editor</text>
  </g>
</svg>
